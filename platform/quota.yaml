# A namespace cannot grow without bound.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: compute
  namespace: web-dev
spec:
  hard:
    requests.cpu: "1"
    requests.memory: 1Gi
    limits.cpu: "2"
    limits.memory: 2Gi
    pods: "10"
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: compute
  namespace: web-staging
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 2Gi
    limits.cpu: "4"
    limits.memory: 4Gi
    pods: "20"
