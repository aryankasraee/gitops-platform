name: ci

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install kubeconform
        run: |
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz \
            | tar xz -C /usr/local/bin kubeconform
      - run: python3 -m pip install --quiet pyyaml
      - run: make check

  e2e:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: helm/kind-action@v1.15.0
        with:
          version: v0.33.0
          config: clusters/kind/kind.yaml
          cluster_name: gitops-platform
      - name: Install Argo CD and sync everything from this commit
        env:
          REPO_URL: https://github.com/${{ github.repository }}.git
          REVISION: ${{ github.sha }}
        run: scripts/up.sh
      - name: Verify behaviour on the live cluster
        run: scripts/verify-cluster.sh
      - name: Diagnostics on failure
        if: failure()
        run: |
          kubectl -n argocd get applications -o wide
          kubectl get pods -A
          kubectl -n argocd logs deploy/argocd-repo-server --tail=60
